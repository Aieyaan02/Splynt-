name: Verify Splynt
on:
  push:
    branches: ['dev/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: splynt_test
          POSTGRES_USER: splynt_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U splynt_test -d splynt_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Verify migrations, schema and database-backed workflows
        run: >-
          ./mvnw --batch-mode --no-transfer-progress clean test
          -Dtest=AccountActionServiceTest,PasswordChangeHttpTest,InventoryIdempotencyTest,StoreSettingsHttpTest,ProductSettingsHttpTest,DecimalInventoryHttpTest,CloverImportReviewHttpTest,AdviceHttpTest,AdviceConcurrencyTest,CloverSalesSyncServiceTest,StoreOnboardingAcceptanceTest
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/splynt_test
          -Dspring.datasource.username=splynt_test
          -Dspring.datasource.password=ci-only-password
          -Dspring.jpa.hibernate.ddl-auto=validate
          -Dspring.flyway.enabled=true
          -Dspring.docker.compose.enabled=false
  container:
    needs: [application, postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the Render runtime image without publishing
        run: docker build --tag splynt:verify .
