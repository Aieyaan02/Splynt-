spring.application.name=splynt
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
splynt.security.jwt.secret=${SPLYNT_JWT_SECRET}
splynt.security.jwt.issuer=https://api.splynt.local
splynt.security.jwt.access-token-ttl=PT1H
# Account email is explicitly disabled until a trusted sender/origin and SMTP service are configured.
splynt.account-email.enabled=${SPLYNT_ACCOUNT_EMAIL_ENABLED:false}
splynt.account-email.from=${SPLYNT_ACCOUNT_EMAIL_FROM:}
splynt.account-email.origin=${SPLYNT_ACCOUNT_EMAIL_ORIGIN:}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=10000
spring.mail.properties[mail.smtp.writetimeout]=10000
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.auth]=true
