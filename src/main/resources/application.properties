spring.application.name=splynt
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
splynt.security.jwt.secret=${SPLYNT_JWT_SECRET}
splynt.security.jwt.issuer=https://api.splynt.local
splynt.security.jwt.access-token-ttl=PT1H
# Account email is explicitly disabled until a trusted sender/origin and SMTP service are configured.
splynt.account-email.enabled=${SPLYNT_ACCOUNT_EMAIL_ENABLED:false}
splynt.account-email.from=${SPLYNT_ACCOUNT_EMAIL_FROM:}
splynt.account-email.origin=${SPLYNT_ACCOUNT_EMAIL_ORIGIN:}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=10000
spring.mail.properties[mail.smtp.writetimeout]=10000
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.auth]=true

# Inventory-only pilot: no order imports, sales endpoints, or AI endpoints.
splynt.sales.enabled=${SPLYNT_SALES_ENABLED:false}

# Contact notifications use HTTPS, supported on Render Free. Enable only after sender verification.
splynt.contact-email.enabled=${SPLYNT_CONTACT_EMAIL_ENABLED:false}
splynt.contact-email.to=${SPLYNT_CONTACT_EMAIL_TO:}
splynt.contact-email.from=${SPLYNT_CONTACT_EMAIL_FROM:}
splynt.contact-email.api-key=${BREVO_API_KEY:}

# Server-only provisioning. Never enable through public account registration.
splynt.platform.bootstrap.enabled=${SPLYNT_PLATFORM_BOOTSTRAP_ENABLED:false}
splynt.platform.bootstrap.email=${SPLYNT_PLATFORM_BOOTSTRAP_EMAIL:}
splynt.platform.bootstrap.password-hash=${SPLYNT_PLATFORM_BOOTSTRAP_PASSWORD_HASH:}

splynt.platform.mfa-key=${SPLYNT_PLATFORM_MFA_KEY:}
