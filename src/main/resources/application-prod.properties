# Disable Spring Boot's development-only Docker Compose integration.
# Production containers receive their database configuration through
# environment variables.
spring.docker.compose.enabled=false

# AWS or another hosting platform can override the application port.
server.port=${PORT:8080}

# The public identity used when Splynt creates and validates JWTs.
splynt.security.jwt.issuer=${SPLYNT_JWT_ISSUER:https://splynt.example}

# API documentation is disabled in production by default.
# It can temporarily be enabled with SPRINGDOC_ENABLED=true.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# Splynt uses React instead of server-rendered Thymeleaf templates.
spring.thymeleaf.check-template-location=false

# Clover sandbox inventory integration.
splynt.integrations.clover.base-url=https://apisandbox.dev.clover.com
splynt.integrations.clover.merchant-id=${CLOVER_MERCHANT_ID}
splynt.integrations.clover.access-token=${CLOVER_ACCESS_TOKEN}