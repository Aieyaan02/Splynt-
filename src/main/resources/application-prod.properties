# Disable Spring Boot's development-only Docker Compose integration.
# Production containers receive their database configuration through
# environment variables.
spring.docker.compose.enabled=false

# AWS or another hosting platform can override the application port.
server.port=${PORT:8080}

# The public identity used when Splynt creates and validates JWTs.
splynt.security.jwt.issuer=${SPLYNT_JWT_ISSUER:https://splynt.example}

# API documentation is disabled in production by default.
# It can temporarily be enabled with SPRINGDOC_ENABLED=true.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# Splynt uses React instead of server-rendered Thymeleaf templates.
spring.thymeleaf.check-template-location=false

# Configure Clover app credentials, never a shared merchant access token.
splynt.integrations.clover.base-url=${CLOVER_BASE_URL:https://apisandbox.dev.clover.com}
splynt.integrations.clover.authorization-url=${CLOVER_AUTHORIZATION_URL:https://sandbox.dev.clover.com/oauth/v2/authorize}
splynt.integrations.clover.client-id=${CLOVER_CLIENT_ID:}
splynt.integrations.clover.client-secret=${CLOVER_CLIENT_SECRET:}
splynt.integrations.clover.redirect-uri=${CLOVER_REDIRECT_URI:}
splynt.integrations.clover.encryption-key=${CLOVER_ENCRYPTION_KEY:}
# Render terminates HTTPS at its trusted reverse proxy.
server.forward-headers-strategy=framework

# Only verified, allowlisted platform operators can read contact submissions.
splynt.contact.operator-emails=${SPLYNT_CONTACT_OPERATOR_EMAILS:}
